name: Install and test AVA
on:
  push:
    # branches:
      # - main
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "media/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nodejs:
    name: Node.js
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [^22.20, ^24.12, ^26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Enable symlinks
        if: matrix.os == 'windows-latest'
        run: |
          git config core.symlinks true
          git reset --hard
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - run: ./scripts/ci.sh
        shell: bash
      - uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: coverage/lcov.info
          name: ${{ matrix.os }}/${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  typescript:
    name: TypeScript compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ts-version: [~5.9, ~6.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: pnpm add typescript@${TS_VERSION}
        env:
          TS_VERSION: ${{ matrix.ts-version }}
      - run: ./node_modules/typescript/bin/tsc --version
      - run: ./node_modules/typescript/bin/tsc --noEmit

  lockfile_churn:
    name: Test lockfile for unexpected modifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - name: Test lockfile for unexpected modifications
        run: |
          pnpm -v
          checksum=$(sha512sum pnpm-lock.yaml)
          pnpm install --lockfile-only --no-audit
          if ! echo ${checksum} | sha512sum --quiet -c -; then
            echo "pnpm-lock.yaml was modified unexpectedly. Please rebuild it using pnpm@$(pnpm -v) and commit the changes."
            exit 1
          fi

  without_lockfile:
    name: Install dependencies without using a lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: pnpm install --no-lockfile
      - run: ./scripts/ci.sh
        shell: bash

  xo:
    name: Lint source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: npx xo
